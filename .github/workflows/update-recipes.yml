name: Update Crafting Recipes

on:
  schedule:
    # 06:17 UTC daily
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-crafting-recipes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run regression and security tests
        run: npm test

      - name: Scrape recipes.json from starrupture.tools
        run: npm run scrape-recipes

      - name: Validate generated dataset
        run: node scripts/validate-recipes.mjs

      - name: Upload validated recipes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-recipes
          path: data/recipes.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - name: Download validated recipes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-recipes
          path: data

      - name: Revalidate before publishing
        run: node scripts/validate-recipes.mjs

      - name: Commit and push if changed
        env:
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/recipes.json

          if git diff --cached --quiet; then
            echo "No recipe changes to commit. Keeping existing dataset."
            exit 0
          fi

          git commit -m "Auto-update recipes.json"
          auth=$(printf 'x-access-token:%s' "$PUBLISH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          echo "Published schema-validated recipe data." >> "$GITHUB_STEP_SUMMARY"
